{% extends 'mailing/base.html' %}
{% block content %}
<h2>Вход в систему</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
    <a href="{% url 'users:password_reset' %}" class="btn btn-secondary">Забыли пароль?</a>
</form>
{% endblock %}
