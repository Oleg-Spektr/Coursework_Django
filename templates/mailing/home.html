{% extends 'mailing/base.html' %}
{% block content %}
<h2>Статистика сервиса</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Всего рассылок</h5>
            <p class="display-6">{{ total_mailings }}</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Активных рассылок</h5>
            <p class="display-6">{{ active_mailings }}</p>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Уникальных получателей</h5>
            <p class="display-6">{{ unique_recipients }}</p>
        </div>
    </div>
</div>
{% endblock %}
